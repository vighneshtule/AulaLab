# Blank issues stay enabled for the sake of questions: Discussions are turned
# off in the repository, and without a blank form a question would have
# nowhere to go.
blank_issues_enabled: true
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/vighneshtule/AulaLab/security/advisories/new
    about: Report privately. Never open a public issue for a vulnerability.
  - name: Documentation
    url: https://github.com/vighneshtule/AulaLab/tree/main/docs/pages/en/
    about: Guides for installing, teaching with and operating Aula Lab.
  - name: Troubleshooting
    url: https://github.com/vighneshtule/AulaLab/tree/main/docs/pages/en/troubleshooting.html
    about: Common problems and how to diagnose them before filing a bug.
