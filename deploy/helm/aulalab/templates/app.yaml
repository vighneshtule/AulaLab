{{- $caConfigMap := include "aulalab.extraCaConfigMap" . }}
{{- $configSecret := include "aulalab.appConfigSecret" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aulalab-app
  {{- include "aulalab.namespace" . | nindent 2 }}
  labels:
    {{- include "aulalab.labels" (dict "ctx" . "component" "app") | nindent 4 }}
spec:
  {{- /*
  One replica and Recreate: the database is SQLite with a single writer, and
  the rooms' live state sits in this one process. A rolling update would run
  two writers on one file. Rooms themselves survive the app's restart.
  */}}
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "aulalab.selectorLabels" (dict "ctx" . "component" "app") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aulalab.labels" (dict "ctx" . "component" "app") | nindent 8 }}
        aulalab.dev/role: app
      annotations:
        {{- /* Settings reach the app at start: a change restarts it. No generated secret is hashed, or every render would. */}}
        checksum/config: {{ list (include (print $.Template.BasePath "/configmaps.yaml") .) (include "aulalab.appSecretSettings" .) $configSecret | toJson | sha256sum }}
        {{- with .Values.app.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: aulalab-app
      automountServiceAccountToken: false
      {{- /* The broker creates a Service per room: without this every restart would inject variables for all of them. */}}
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      {{- with include "aulalab.imagePullSecrets" . }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with .Values.app.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.app.affinity }}
      affinity:
        {{- toYaml .Values.app.affinity | nindent 8 }}
      {{- else if eq (include "aulalab.colocate" .) "1" }}
      {{- /*
      A ReadWriteOnce volume is attached to one node, and rooms outlive the app:
      a new app Pod on another node would wait for the attachment until every
      room there had stopped. So it prefers the node where they run.
      */}}
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: aulalab.dev/role
                      operator: In
                      values: ["kernel", "own", "competition-job", "competition-resolver"]
      {{- end }}
      containers:
        - name: app
          image: {{ include "aulalab.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: aulalab-app-env
            {{- if $configSecret }}
            - secretRef:
                name: {{ $configSecret }}
            {{- end }}
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: BIND_ADDR
              value: 0.0.0.0
            - name: DATA_DIR
              value: /data
            - name: WORKSPACE_DIR
              value: /workspace
            - name: KERNEL_BACKEND
              value: broker
            - name: KERNEL_RUNTIME_URL
              value: http://aulalab-runtime.{{ .Release.Namespace }}.svc:8787
            - name: KERNEL_RUNTIME_TOKEN_FILE
              value: /run/secrets/runtime-token
            - name: KERNEL_CATALOG_FILE
              value: /etc/aulalab/catalog.json
            {{- /* Settings other objects of the chart are rendered from (the room policy, the broker): they win over the Secret. */}}
            {{- with .Values.rooms.network }}
            - name: AULALAB_ROOM_NETWORK
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.dependencies.indexUrl }}
            - name: DEPENDENCY_INDEX_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.dependencies.filesHosts }}
            - name: DEPENDENCY_FILES_HOSTS
              value: {{ . | quote }}
            {{- end }}
            {{- if $caConfigMap }}
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/aulalab-ca/extra-ca.pem
            {{- end }}
            {{- if .Values.config.sso.jwks }}
            - name: AUTH_JWT_JWKS_FILE
              value: /etc/aulalab-sso/jwks.json
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "aulalab.metricsSecret" . }}
                  key: {{ include "aulalab.metricsKey" . }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.app.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.app.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.app.readinessProbe | nindent 12 }}
          volumeMounts:
            - name: catalog
              mountPath: /etc/aulalab
              readOnly: true
            - name: runtime-token
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            - name: workspace
              mountPath: /workspace
            {{- if $caConfigMap }}
            - name: extra-ca
              mountPath: /etc/aulalab-ca
              readOnly: true
            {{- end }}
            {{- if .Values.config.sso.jwks }}
            - name: sso-jwks
              mountPath: /etc/aulalab-sso
              readOnly: true
            {{- end }}
      volumes:
        - name: catalog
          configMap:
            name: aulalab-catalog
        - name: runtime-token
          secret:
            secretName: {{ include "aulalab.runtimeTokenSecret" . }}
            defaultMode: 0440
            items:
              - key: {{ include "aulalab.runtimeTokenKey" . }}
                path: runtime-token
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "aulalab.dataClaim" . }}
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "aulalab.workspaceClaim" . }}
        {{- if $caConfigMap }}
        - name: extra-ca
          configMap:
            name: {{ $caConfigMap }}
            items:
              - key: {{ include "aulalab.extraCaKey" . }}
                path: extra-ca.pem
        {{- end }}
        {{- if .Values.config.sso.jwks }}
        - name: sso-jwks
          configMap:
            name: aulalab-sso-jwks
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: aulalab-app
  {{- include "aulalab.namespace" . | nindent 2 }}
  labels:
    {{- include "aulalab.labels" (dict "ctx" . "component" "app") | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "aulalab.selectorLabels" (dict "ctx" . "component" "app") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
