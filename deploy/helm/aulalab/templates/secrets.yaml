{{- $appSecrets := include "aulalab.appSecretSettings" . | fromJson }}
{{- if and $appSecrets (not .Values.config.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: aulalab-app-config
  {{- include "aulalab.namespace" . | nindent 2 }}
  labels:
    {{- include "aulalab.labels" (dict "ctx" . "component" "app") | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := $appSecrets }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
{{- /*
The two internal secrets, each generated once and then read back from the live
Secret on every upgrade (aulalab.secretData). They stay in two Secrets, as the
k3s installer had them: the app mounts only the runtime token and never sees
the key room tokens are derived from.
*/}}
{{- if not .Values.secrets.runtimeToken.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: aulalab-runtime-auth
  {{- include "aulalab.namespace" . | nindent 2 }}
  labels:
    {{- include "aulalab.labels" (dict "ctx" . "component" "runtime") | nindent 4 }}
type: Opaque
data:
  runtime-token: {{ include "aulalab.secretData" (dict "ctx" . "secret" "aulalab-runtime-auth" "key" "runtime-token" "value" .Values.secrets.runtimeToken.value) | quote }}
{{- end }}
{{- if not .Values.secrets.roomSecret.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: aulalab-room-secret
  {{- include "aulalab.namespace" . | nindent 2 }}
  labels:
    {{- include "aulalab.labels" (dict "ctx" . "component" "runtime") | nindent 4 }}
type: Opaque
data:
  room-secret: {{ include "aulalab.secretData" (dict "ctx" . "secret" "aulalab-room-secret" "key" "room-secret" "value" .Values.secrets.roomSecret.value) | quote }}
{{- end }}
{{- if and .Values.metrics.enabled (not .Values.metrics.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: aulalab-metrics
  {{- include "aulalab.namespace" . | nindent 2 }}
  labels:
    {{- include "aulalab.labels" (dict "ctx" . "component" "metrics") | nindent 4 }}
type: Opaque
data:
  metrics-token: {{ include "aulalab.secretData" (dict "ctx" . "secret" "aulalab-metrics" "key" "metrics-token" "value" .Values.metrics.token) | quote }}
{{- end }}
